<div class="container mt-5">
    <h1 class="mb-4 text-center fw-bold">Tareas</h1>
    <div class="row g-4">
        @for(task of tasks; track task.id) {
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="card h-100 task-card">
                <div class="card-body task-body" [class]="task.done ? 'done' : 'pending'">
                    <h4 class="card-title">{{ task.title }}</h4>
                    <p class="card-text">{{ task.description }}</p>
                    <div class="form-check form-switch mt-3">
                        <input class="form-check-input" type="checkbox" id="switch" [checked]="task.done"
                            (change)="cambiarEstado(task.id)">

                        <label class="form-check-label" for="mySwitch">
                            @if (task.done) {
                            Hecha
                            } @else {
                            Sin Hacer
                            }
                        </label>
                    </div>
                </div>
            </div>
        </div>
        }
    </div>
</div>
