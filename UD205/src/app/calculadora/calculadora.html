<div class="card mx-auto mt-4" style="max-width: 320px">

  <div class="card-body p-3 ">
    <!-- Pantalla -->
    <input
      type="text"
      class="form-control form-control-lg text-end mb-3"
      [ngModel]="display"
      value="0"
      readonly
      aria-label="Pantalla de la calculadora"
    />

    <!-- teclafo -->
    <div class="row g-2">
      <div class="d-flex gap-2">
        <!-- boton de clear y volver -->
        <button class="btn btn-danger btn-lg flex-fill" (click)="clearDisplay()">C</button>

        <!--<button class="btn btn-danger btn-lg flex-fill" (click)="backSpace()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="currentColor"
            class="bi bi-backspace-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M15.683 3a2 2 0 0 0-2-2h-7.08a2 2 0 0 0-1.519.698L.241 7.35a1 1 0 0 0 0 1.302l4.843 5.65A2 2 0 0 0 6.603 15h7.08a2 2 0 0 0 2-2zM5.829 5.854a.5.5 0 1 1 .707-.708l2.147 2.147 2.146-2.147a.5.5 0 1 1 .707.708L9.39 8l2.146 2.146a.5.5 0 0 1-.707.708L8.683 8.707l-2.147 2.147a.5.5 0 0 1-.707-.708L7.976 8z"
            />
          </svg>
        </button>-->
      </div>

      <!-- numeritos -->
      @for (num of numeros; track $index) { <!--al no ser 'objetos' he visto que se puede utilizar $index osea el indice en vez de un id o atributo-->
      <div class="col-4">
        <button (click)="numberToDisplay(num)" class="btn btn-light btn-lg w-100">{{ num }}</button>
      </div>
      }

      <!-- operadores-->
      <div class="col-6">
        <button class="btn btn-light btn-lg w-100" (click)="operatorToDisplay('.')">.</button>
      </div>
      <div class="col-3">
        <button class="btn btn-info btn-lg w-100" (click)="operatorToDisplay('+')">+</button>
      </div>
      <div class="col-3">
        <button class="btn btn-info btn-lg w-100" (click)="operatorToDisplay('-')">−</button>
      </div>
      <div class="col-3">
        <button class="btn btn-info btn-lg w-100" (click)="operatorToDisplay('/')">÷</button>
      </div>
      <div class="col-3">
        <button class="btn btn-info btn-lg w-100" (click)="operatorToDisplay('*')">×</button>
      </div>

      <!-- = -->
      <div class="col-12">
        <button class="btn btn-success btn-lg w-100" (click)="calculate()">=</button>
      </div>
    </div>
  </div>
</div>
