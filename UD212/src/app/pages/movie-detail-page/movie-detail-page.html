<div class="container my-4">
  <div class="card shadow-lg border-0">
    <div class="card-body">
      <div class="text-center mb-4">
        <h2 class="card-title">{{ movie?.title }}</h2>
        <h5 class="card-subtitle text-muted">{{ movie?.original_title }}</h5>
      </div>

      <div class="row align-items-start">
     
        <div class="col-lg-4 col-md-5 col-sm-12 mb-3 text-center">
          <img
            class="img-fluid rounded shadow"
            [src]="'https://image.tmdb.org/t/p/w500' + movie?.poster_path"
            alt="Poster de {{ movie?.title }}"
          />
        </div>


        <div class="col-lg-8 col-md-7 col-sm-12">
          <div class="mb-3">
            <h5 class="text-primary">Descripción</h5>
            <p class="text-justify">{{ movie?.overview }}</p>
          </div>

          <div class="mb-3">
            <h5 class="text-primary">Fecha de estreno</h5>
            <p>{{ movie?.release_date }}</p>
          </div>

          <div class="mb-3">
            <h5 class="text-primary">País de origen</h5>
            <p>{{ movie?.origin_country }}</p>
          </div>

          <div class="mb-3">
            <h5 class="text-primary">Popularidad</h5>
            <p>{{ movie?.popularity }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
