<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand d-flex align-items-center" href="#">
    <img src="https://cdn-icons-png.flaticon.com/512/5359/5359331.png" alt="Logo" style="height: 40px; margin-right: 10px" />
    <span><h1>Nutflix</h1></span>
  </a>

  <div class="collapse navbar-collapse">
    <div class="d-flex gap-3 ms-auto">
      <select
        class="form-select"
        style="width: 300px"
        [(ngModel)]="id"
        (ngModelChange)="getMoviesById()"
      >
        <option [value]="0" disabled selected>Elige un género</option>
        @for (genre of genres; track genre.id) {
        <option [value]="genre.id">{{ genre.name }}</option>
        } @empty {
        <option disabled>No hay géneros</option>
        }
      </select>

  
      <select
        class="form-select"
        style="width: 300px"
        [(ngModel)]="type"
        (ngModelChange)="getMoviesById()"
        (ngModelChange)="ngOnInit()"
      >
        <option value="movie" selected>Peliculas</option>
        <option value="tv" selected>Series</option>
      </select>
    </div>
  </div>
</nav>

<div class="d-flex flex-wrap">
  @for (movie of movies; track movie.id){
  <div class="card m-4" style="width: 18rem">
    <img
      class="card-img-top"
      [src]="'https://image.tmdb.org/t/p/w500' + movie.poster_path"
      alt="Card image cap"
    />
    <!--Esto no lo acabop de entender-->
    <div class="card-body">
      <h2 class="card-title">{{ movie.title }}</h2>
      <h5 class="card-title">{{ movie.original_title }}</h5>
      <p class="card-text">{{ movie.overview }}</p>
      <p class="card-text">{{ movie.release_date }}</p>
    </div>
  </div>
  }
</div>
