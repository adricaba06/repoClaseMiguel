@for(vehicle of vehicleList; track vehicle.name) {
<div class="col-md-3">
    <div class="card-body bg-black p-3 rounded-4 text-white m-2 mb-4">
        <h4 class="card-title">Nombre: {{vehicle.name}}</h4>
        <p class="card-text">Tamaño: {{vehicle.length}}</p>
        <p class="card-text">Tripulación: {{vehicle.crew}}</p>
    </div>

    <button class="btn btn-primary" (click)="takeUrl(vehicle.url)">
        Abrir vehículo
    </button>

</div>


}
