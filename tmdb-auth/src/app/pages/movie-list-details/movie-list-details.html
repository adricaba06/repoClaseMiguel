<header> <!-- Fixed navbar -->
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark mb-4">
        <div class="container-fluid"> <a class="navbar-brand" href="#">Popcorn App</a> <button class="navbar-toggler"
                type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse"
                aria-expanded="false" aria-label="Toggle navigation"> <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item"> <a class="nav-link active" aria-current="page" href="#">Home</a> </li>
                    <li class="nav-item"> <a class="nav-link" href="#">Link</a> </li>
                    <li class="nav-item"> <a class="nav-link disabled" aria-disabled="true">Disabled</a> </li>
                    <li class="nav-item"> <a class="nav-link" routerLink="list">Listas</a> </li>
                    <li class="nav-item"> <a class="nav-link">Iniciar</a> </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<main>
    <div class="d-flex m-5">
        @for(movie of movies; track movie.id) {
        <div class="card mt-5 me-3" style="width: 18rem; background-size: cover; background-position: center;">
            <div class="card-body">
                <img src="https://image.tmdb.org/t/p/w500{{movie.poster_path}}" class="card-img-top">
                <h5 class="card-title">{{movie.original_title}}</h5>
                <p class="card-text">{{movie.title}}</p>
                <p class="card-text">{{movie.release_date}}</p>
            </div>
            <button class="btn btn-danger mb-3" (click)="removeMovieFromList(movie.id)">Eliminar de la lista</button>
        </div>
        }
    </div>
</main>
