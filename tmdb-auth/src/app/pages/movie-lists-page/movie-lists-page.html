<header>
  <!-- Fixed navbar -->
  <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Popcorn App</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarCollapse"
        aria-controls="navbarCollapse"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarCollapse">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Link</a></li>
          <li class="nav-item"><a class="nav-link disabled" aria-disabled="true">Disabled</a></li>
          <li class="nav-item"><a class="nav-link" routerLink="list">Listas</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>
<main>
  <h1>Movie list</h1>

  <div class="d-flex">
    @for(list of listOfMovies; track list.id) {
    <div class="card m-5" style="width: 30rem">
        <div class="card-body bg-blue">
          <h5 class="card-title">{{ list.name }}</h5>
          <p class="card-text">{{ list.description }}</p>
          <p class="card-text">{{ list.item_count }} Elementos</p>
          <div class="d-flex">
            <button class="btn btn-secondary me-2" (click)="navigateToDetails(list.id)">
              Ver lista
            </button>
            <button class="btn btn-danger" (click)="deleteList(list.id)">Borrar</button>
            <button class="btn btn-lg btn-info ms-2" (click)="open(content)" (click)="getId(list.id) ">Agregar Pelicula</button>
          </div>
        </div>
      
    </div>
    }
  </div>



  <ng-template #content let-modal>
	<div class="modal-header">
		<h4 class="modal-title" id="modal-basic-title">Agregar Peliculas</h4>
		<button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
	</div>
	<div class="modal-body">
		<form>
			<div class="mb-3">
                @for (movie of movieList; track movie.id) {
                    <div class="p-3 m-2 alert alert-primary">{{movie.title}}</div>
                    <button (click)="addMovie(movie.id)">Agregar</button>
                }
			</div>
		</form>
	</div>
	<div class="modal-footer">
		<button type="button" class="btn btn-outline-secondary" (click)="modal.close('Save click')">Save</button>
	</div>
</ng-template>



</main>
